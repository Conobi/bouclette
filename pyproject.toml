[project]
name = "boucle"
version = "0.1.0"
description = "Platform-agnostic I/O library for Mojo"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mojox>=0.5",
    "mojo-compiler==1.0.0",
    "mojo-compiler-mojo-libs==1.0.0",
]

[build-system]
requires = [
    "mojox-build>=0.5",
    "mojox-core>=0.5",
    "mojo-compiler==1.0.0",
    "mojo-compiler-mojo-libs==1.0.0",
]
build-backend = "mojox_build"

[tool.uv]
prerelease = "allow"

[tool.mojox]
packages = ["boucle"]
test-parallel = true

[tool.mojox.lints]
warnings = "error"
