name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3

      - name: Sync dependencies
        run: uv sync

      - name: Build boucle.mojopkg (x86_64)
        env:
          BOUCLE_TARGET_ARCH: x86_64
        run: uv run -- bash scripts/build.sh

      - name: Probe runtime environment
        run: |
          echo "io_uring_disabled: $(cat /proc/sys/kernel/io_uring_disabled 2>/dev/null || echo MISSING)"
          echo "cpu user_shstk:    $(grep -oE '(^| )user_shstk( |$)' /proc/cpuinfo | head -1 | tr -d ' ' || echo none)"
          echo "cpu ibt:           $(grep -oE '(^| )ibt( |$)' /proc/cpuinfo | head -1 | tr -d ' ' || echo none)"
          echo "AT_HWCAP2:         $(LD_SHOW_AUXV=1 /bin/true 2>&1 | awk -F: '/^AT_HWCAP2:/{print $2; exit}' | tr -d ' \t')"
          echo "thread features:   $(awk -F: '/^x86_Thread_features:/{print $2}' /proc/self/status | tr -d ' \t' || echo none)"
          echo "glibc:             $(ldd --version | head -1)"
          echo "kernel:            $(uname -r)"

      - name: Run tests (x86_64)
        env:
          BOUCLE_TARGET_ARCH: x86_64
        run: uv run -- bash scripts/run_tests.sh

  build-and-test-aarch64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Build and test under aarch64 qemu
        uses: uraimo/run-on-arch-action@ac33288c3728ca72563c97b8b88dda5a65a84448 # v2
        with:
          arch: aarch64
          distro: ubuntu22.04
          githubToken: ${{ github.token }}
          install: |
            apt-get update -q -y
            apt-get install -q -y curl ca-certificates bash
            curl -LsSf https://astral.sh/uv/0.11.16/install.sh | sh
            ln -sf /root/.local/bin/uv /usr/local/bin/uv
          env: |
            BOUCLE_TARGET_ARCH: aarch64
            SKIP_IO_URING_TESTS: '1'
          run: |
            uv sync
            uv run -- bash scripts/build.sh
            uv run -- bash scripts/run_tests.sh
